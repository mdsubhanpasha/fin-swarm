version: '3.8'

services:
  api:
    build: .
    container_name: fin_swarm_api
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

  dashboard:
    build: .
    container_name: fin_swarm_dashboard
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0